[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-copilot"
version = "1.0.0"
description = "Native Windows AI Interview Copilot (PyQt6)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyQt6>=6.6.0",
  "numpy>=1.26.0",
  "Pillow>=10.0.0",
  "mss>=9.0.1",
  "pytesseract>=0.3.10",
  "sounddevice>=0.4.6",
  "groq>=0.9.0",
  "google-genai>=0.3.0",
  "google-generativeai>=0.8.0",
  "chromadb>=0.5.0",
  "pypdf>=4.0.0",
  "python-docx>=1.1.0",
  "cryptography>=42.0.0",
  "python-dotenv>=1.0.0",
  "keyboard>=0.13.5",
  "httpx>=0.27.0",
]

[project.scripts]
interview-copilot = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
